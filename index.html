:root{--green:#176449;--ink:#16382e;--paper:#f6f7f2;--line:#e1e6df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select{outline-offset:4px}button{border:0;border-radius:8px;padding:11px 17px;background:var(--green);color:white;font-weight:600}button:hover{filter:brightness(.94)}button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}button.small{padding:7px 11px;font-size:12px}header{height:84px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:48px;padding:0 4%;background:white;position:sticky;top:0;z-index:5}.brand{font:800 23px Manrope;letter-spacing:-1px;white-space:nowrap}.brand i{background:var(--green);color:#fff;padding:4px 9px;border-radius:9px;margin-right:8px;font-style:normal}nav{display:flex;gap:8px;flex:1}nav button{background:none;color:#718078;padding:12px}nav button.active{color:var(--green);background:#eef4ed}.walletpill{background:#eff4ec;border-radius:30px;padding:11px 17px;font-weight:700}.avatar{border-radius:50%;background:#eadbc3;width:36px;height:36px;display:inline-grid;place-items:center;color:#714b25;font-weight:700}main{max-width:1390px;margin:auto;padding:32px 4%}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:#668477}h1,h2,h3{font-family:Manrope;margin:0}h1{font-size:51px;letter-spacing:-2.5px;line-height:1.13;max-width:640px}h2{font-size:25px;letter-spacing:-.7px}p{line-height:1.65;color:#738079}.hero{display:grid;grid-template-columns:1.15fr 1fr;background:#e8eee1;border-radius:16px;overflow:hidden;margin-bottom:30px;min-height:330px}.hero-copy{padding:35px 40px}.hero p{max-width:430px;margin:16px 0 22px;color:#607365}.hero-art{position:relative;min-height:320px;background:radial-gradient(ellipse at center,#d2dfc4,transparent 68%);display:flex;align-items:center;justify-content:center}.orb{border:1px solid #bcccad;border-radius:50%;width:280px;height:280px;position:absolute}.orb:after{content:'';position:absolute;inset:35px;border:1px dashed #bdcbae;border-radius:50%}.artcard{position:absolute;box-shadow:0 18px 35px #28422a20;border:6px solid #fff;border-radius:10px;width:160px;height:205px;display:flex;flex-direction:column;justify-content:center;padding:20px;font-family:Manrope}.artcard.one{background:#284d42;color:#e6e9b4;transform:rotate(-13deg);left:17%;top:38px;font-size:25px;font-weight:800}.artcard.two{background:#dd9a67;transform:rotate(12deg);left:48%;top:78px;color:#502d25;font-size:21px;font-weight:800}.artbadge{position:absolute;bottom:26px;background:white;border-radius:30px;padding:12px 20px;box-shadow:0 6px 18px #28422a12}.toolbar{display:flex;gap:12px;margin:24px 0 18px}.search{flex:1;background:white;border:1px solid var(--line);padding:14px 18px;border-radius:9px;min-width:0}.chips{display:flex;gap:9px;overflow:auto;padding-bottom:18px}.chips button{white-space:nowrap;background:white;color:#6a786f;border:1px solid var(--line);font-size:12px;padding:9px 15px;border-radius:30px}.chips button.active{background:var(--green);color:white;border-color:var(--green)}.sectionrow{display:flex;justify-content:space-between;align-items:center;margin:12px 0 20px}.muted{color:#7a877f;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #16382e0c}.cover{height:182px;padding:23px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}.cover .design{font-family:Manrope;font-size:29px;font-weight:800;letter-spacing:-1px;line-height:1.05;max-width:180px;text-align:center}.cover:before{content:'';width:130px;height:130px;border:1px solid currentColor;opacity:.16;position:absolute;transform:rotate(30deg);border-radius:25px}.tag{position:absolute;top:12px;left:12px;background:#ffffffdc;color:#355d48;font-size:10px;padding:5px 8px;border-radius:5px;font-weight:700}.cardbody{padding:17px}.card h3{font-size:14px;margin:9px 0 8px}.creator{font-size:11px;color:#809087}.cardfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;border-top:1px solid #eff1ec;padding-top:13px}.price{font-weight:800;font-size:15px}.price small{font-weight:400;font-size:10px;color:#829086}.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8b968c}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:26px;margin:20px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}.stat{font:800 38px Manrope;margin:12px 0}.note{background:#edf3e8;padding:14px;border-radius:8px;font-size:12px;line-height:1.6;margin:14px 0;color:#486550}label{display:block;font-size:12px;font-weight:600;margin:15px 0 7px}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:12px;background:#fff;color:var(--ink);max-width:100%}input:not([type=checkbox]),select,textarea{width:100%}.row{display:flex;gap:10px;align-items:center}.row input[type=checkbox]{width:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px 8px;border-bottom:1px solid var(--line);font-size:12px}th{color:#819087;font-weight:500}.badge{background:#edf4e8;padding:5px 9px;border-radius:20px;font-size:11px}.scrollcards{display:flex;gap:20px;overflow:auto;padding:20px 0}.scrollcards .card{min-width:260px;max-width:280px}.empty{text-align:center;padding:60px}footer{display:flex;justify-content:space-between;margin:40px 0 8px;padding-top:20px;border-top:1px solid var(--line);color:#8a948b;font-size:11px}.demobar{font-size:11px;color:#819080;margin-bottom:17px;display:flex;justify-content:space-between}dialog{border:1px solid var(--line);border-radius:16px;padding:30px;max-width:560px;width:94%;color:var(--ink)}dialog::backdrop{background:#102b236b;backdrop-filter:blur(3px)}.close{float:right;background:#eff3eb;color:#395847;padding:6px 10px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#153e30;color:white;padding:15px 24px;border-radius:10px;z-index:30;box-shadow:0 8px 30px #0002}.cycle{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.cycle span{padding:16px;border:1px solid #cfdccc;border-radius:9px;background:#f3f6ed}.hidden{display:none}@media(max-width:1000px){header{gap:16px;padding:0 20px}.brand{font-size:19px}nav{gap:0}nav button{font-size:12px;padding:10px}.grid{grid-template-columns:repeat(3,1fr)}h1{font-size:40px}.hero-copy{padding:30px}.hero-art{transform:scale(.9)}}@media(max-width:720px){header{flex-wrap:wrap;height:auto;padding:16px;gap:12px}nav{order:3;overflow:auto;flex-basis:100%}.walletpill{margin-left:auto}header>.avatar{display:none}.hero{grid-template-columns:1fr}.hero-art{display:none}h1{font-size:38px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cols{grid-template-columns:1fr}.cover{height:160px;padding:12px}.cover .design{font-size:23px}.cardbody{padding:12px}.toolbar{flex-wrap:wrap}.hero-copy{padding:28px}.cardfoot{align-items:flex-start;gap:8px;flex-direction:column}main{padding:24px 16px}.sectionrow h2{font-size:22px}footer{gap:15px}}
</style></head><body><header><div class="brand"><i>⇄</i>BARTERLORD<span style="color:#90a088">.</span></div><nav id="nav"></nav><div class="walletpill" id="walletpill"></div><span class="avatar">SI</span></header><main id="app"></main><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const cats=['All products','E-books','Music & audio','Education','Photography','Art & design','Video','Software','Business templates','Gaming & 3D','Craft & DIY','Digital services','Data & resources'];
let products=[
{id:1,title:'The Creative Business Playbook',cat:'E-books',owner:'Amara Studio',price:1200,color:'#eee1c5',ink:'#74583a',art:'MAKE<br>GOOD<br>BUSINESS.',want:'Art & design'},
{id:2,title:'Midnight Frequencies — Sample Pack',cat:'Music & audio',owner:'Waveform Audio',price:850,color:'#d7d8ed',ink:'#524278',art:'〰<br>MIDNIGHT<br>FREQUENCIES',want:'E-books'},
{id:3,title:'Brand Identity Essentials',cat:'Art & design',owner:'Form & Field',price:1800,color:'#dce7d9',ink:'#3b5942',art:'form<br>& field®',want:'Music & audio'},
{id:4,title:'Master Your First Website',cat:'Education',owner:'Daniel Creates',price:2400,color:'#ead6ca',ink:'#854c3b',art:'Build<br>something<br>brilliant. ↗',want:'Software'},
{id:5,title:'Earth Tones — Lightroom Presets',cat:'Photography',owner:'Maya Lens',price:599,color:'#d1d0b9',ink:'#4e5947',art:'EARTH<br>TONES<br>◒',want:'Video'},
{id:6,title:'Notion Business Operating System',cat:'Business templates',owner:'Organised Co.',price:999,color:'#e1e3de',ink:'#465347',art:'A little<br>more order.<br>▦',want:'Education'},
{id:7,title:'Low Poly Worlds — 3D Asset Kit',cat:'Gaming & 3D',owner:'Pixel Forge',price:1500,color:'#cddce2',ink:'#3b6677',art:'△ ◇ △<br>SMALL<br>WORLDS',want:'Craft & DIY'},
{id:8,title:'Cinematic Stories — Video Toolkit',cat:'Video',owner:'Motion House',price:2000,color:'#e7d4b9',ink:'#76512b',art:'STORIES<br>IN<br>MOTION ▶',want:'Photography'}];
const initial={balance:5000,earned:0,owned:[],following:[],requests:[],campaigns:[],log:[],sub:false,ads:true,approved:[2,3],seen:[],cycles:[]};let s;try{s=JSON.parse(localStorage.getItem('barterlord-v1'))||structuredClone(initial)}catch{s=structuredClone(initial)}let page='Explore',category='All products',query='',barterOnly=false;const money=u=>(u/100).toFixed(2),bp=u=>money(u)+' BP',esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('barterlord-v1',JSON.stringify(s));document.getElementById('walletpill').textContent='◈ '+bp(s.balance)}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.add('hidden'),4000)}function log(t,u=0){s.log.unshift({t,u,time:new Date().toLocaleString()});save()}function go(p){page=p;render();scrollTo(0,0)}function open(html){document.getElementById('modal').innerHTML='<button class="close" onclick="modal.close()" aria-label="Close">×</button>'+html;modal.showModal()}function card(p){return `<article class="card"><div class="cover" style="background:${p.color};color:${p.ink}" onclick="detail(${p.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter')detail(${p.id})">${p.want!=='Not available'?'<span class="tag">⇄ Available for barter</span>':''}<div class="design">${p.art}</div></div><div class="cardbody"><div class="label">${p.cat}</div><h3>${esc(p.title)}</h3><div class="creator" onclick="creator('${p.owner}')" style="cursor:pointer">◉ ${esc(p.owner)} ↗</div><div class="cardfoot"><div class="price">${bp(p.price)} <small>· $${money(p.price)}</small></div><button class="small secondary" onclick="detail(${p.id})">View product ↗</button></div></div></article>`}
function render(){save();document.getElementById('nav').innerHTML=['Explore','Barter hub','Creators','My library','Wallet','Creator studio'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let html='<div class="demobar"><span>THE DIGITAL MARKETPLACE FOR EVERY CREATOR</span><span>Interactive demo · No real payments</span></div>';if(page==='Explore')html+=explore();if(page==='Barter hub')html+=barter();if(page==='Creators')html+=creators();if(page==='My library')html+=library();if(page==='Wallet')html+=wallet();if(page==='Creator studio')html+=studio();document.getElementById('app').innerHTML=html+'<footer><span>⇄ BARTERLORD.COM · Create value. Exchange possibilities.</span><span>$1 = 1 BP = 100 unidots · Digital products only</span></footer>'}
function explore(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow" style="margin-bottom:17px">GOOD IDEAS DESERVE TO GO FURTHER</div><h1>Your next great find.<br>Your next fair trade.</h1><p>Discover digital originals from independent creators. Buy what inspires you, or trade something of your own.</p><button onclick="document.getElementById('search').focus()">Explore the marketplace ↗</button> <button class="secondary" onclick="go('Barter hub')">Find a barter ⇄</button></div><div class="hero-art"><div class="orb"></div><div class="artcard one"><small style="font-size:9px;letter-spacing:2px;margin-bottom:20px">THE CREATOR SERIES</small>Ideas<br>worth<br>sharing. ✳</div><div class="artcard two">YOUR NEXT<br>BIG IDEA<br>STARTS HERE.<span style="font-size:50px">↗</span></div><div class="artbadge">✦ One marketplace. Endless possibilities.</div></div></section><div class="sectionrow"><h2>Discover something valuable</h2><span class="muted">Buy it. Barter it. Make it yours.</span></div><div class="toolbar"><input class="search" id="search" placeholder="Search products, creators, or your next inspiration…" value="${esc(query)}" oninput="query=this.value;drawProducts()"><button class="secondary" onclick="barterOnly=!barterOnly;this.textContent=barterOnly?'✓ Available for barter':'⇄ Available for barter';drawProducts()">${barterOnly?'✓':'⇄'} Available for barter</button></div><div class="chips">${cats.map(c=>`<button class="${c===category?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div class="sectionrow"><span class="muted" id="count"></span><select style="width:auto;padding:8px" aria-label="Sort products" onchange="drawProducts(this.value)"><option value="featured">Featured products</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="grid" id="products">${filtered().map(card).join('')}</div><div class="panel row" style="justify-content:space-between"><div><h3>Made something worth sharing?</h3><p>Open your creator storefront. Sell, barter, and grow your following for $100/year.</p></div><button onclick="go('Creator studio')">Become a creator ↗</button></div>`}function filtered(){return products.filter(p=>(!barterOnly||p.want!=='Not available')&&(category==='All products'||category===p.cat)&&`${p.title} ${p.owner} ${p.cat}`.toLowerCase().includes(query.toLowerCase()))}function drawProducts(sort){let ps=filtered();if(sort==='low')ps.sort((a,b)=>a.price-b.price);if(sort==='high')ps.sort((a,b)=>b.price-a.price);document.getElementById('products').innerHTML=ps.map(card).join('')||'<div class="empty">No products found. Try another search.</div>';document.getElementById('count').textContent=ps.length+' digital products'}
function detail(id){let p=products.find(x=>x.id===id);let adChoices=products.filter(x=>x.id!==id&&s.approved.includes(x.id));let ad=adChoices[Math.floor(Math.random()*adChoices.length)];open(`<div class="eyebrow">${p.cat} · SAMPLE PREVIEW</div><h2 style="margin:14px 0">${esc(p.title)}</h2><div class="cover" style="background:${p.color};color:${p.ink};border-radius:10px"><div class="design">${p.art}</div></div><p>By ${esc(p.owner)} · Digital download. This demonstration includes a sample text file, not a commercial product.</p><div class="stat" style="font-size:25px">${bp(p.price)} <span class="muted">${p.price} unidots</span></div><div class="row"><button onclick="buy(${id})">${s.owned.includes(id)?'Open download':'Buy & unlock full product'}</button><button class="secondary" onclick="requestForm(${id})">Offer a barter ⇄</button></div><p class="muted">Barter accepted for: ${p.want}. Full swaps have no fee. Any top-up requires both owners’ agreement.</p>${s.ads&&ad?`<div class="note"><span class="eyebrow">Advert exchange · creator approved</span><h3 style="margin:9px 0">${ad.title}</h3>${bp(ad.price)} <button class="small secondary" onclick="modal.close();detail(${ad.id})">View product ↗</button></div>`:''}`)}
function buy(id){let p=products.find(x=>x.id===id);if(s.owned.includes(id))return download(id);if(s.balance<p.price)return toast('Insufficient BP. Add demo points in your wallet.');s.balance-=p.price;s.owned.push(id);log('Purchased '+p.title,-p.price);modal.close();toast('Purchase complete. Full demo download unlocked.');go('My library')}function download(id){let p=products.find(x=>x.id===id);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['BARTERLORD DEMO DOWNLOAD\n'+p.title+'\nThis is a placeholder full product for prototype testing.'],{type:'text/plain'}));a.download='BARTERLORD-demo-product-'+id+'.txt';a.click();URL.revokeObjectURL(a.href)}
function creators(){return '<h1 style="font-size:36px">Meet your next collaborator.</h1><p>Independent minds. Original work. A community built on exchange.</p>'+products.slice(0,6).map(p=>`<section class="panel"><div class="sectionrow"><div><h2>${p.owner}</h2><p>Digital originals · Open to ${p.want.toLowerCase()} barters</p></div><button class="secondary" onclick="follow('${p.owner}')">${s.following.includes(p.owner)?'✓ Following':'+ Follow'}</button></div><div class="scrollcards">${products.filter(x=>x.owner===p.owner).map(card).join('')}</div></section>`).join('')}function creator(name){go('Creators');toast('Showing creator storefronts: '+name)}function follow(n){s.following.includes(n)?s.following=s.following.filter(x=>x!==n):s.following.push(n);save();render()}
function library(){return '<h1 style="font-size:36px">Your digital collection.</h1><p>Full downloads from your purchases and agreed exchanges.</p>'+(s.owned.length?'<div class="grid">'+s.owned.map(id=>{let p=products.find(x=>x.id===id);return '<div>'+card(p)+`<button style="width:100%;margin-top:10px" onclick="download(${id})">↓ Download demo full product</button></div>`}).join('')+'</div>':'<div class="panel empty"><h2>Your collection starts here.</h2><p>Explore a sample, buy a product, or complete a barter.</p><button onclick="go(\'Explore\')">Discover products ↗</button></div>')}
function requestForm(id){if(!s.sub){modal.close();go('Creator studio');return toast('Activate the demo creator subscription to send a barter request.')}let p=products.find(x=>x.id===id);open(`<h2>Propose an exchange</h2><p>You want: ${p.title} · ${bp(p.price)}</p><label>Your offered product</label><select id="offer">${products.filter(x=>x.owner==='Singiza Ibrahim'&&x.id!==id).map(x=>`<option value="${x.id}">${esc(x.title)} · ${bp(x.price)}</option>`).join('')}</select><label>Proposed terms</label><select id="terms"><option value="full">Full swap · no top-up, no fee</option><option value="topup">Swap + exact price-difference top-up</option></select><div class="note">This sends a proposal only. The higher-priced product owner can waive the difference or require the exact top-up. Both owners must accept the final terms.</div><button onclick="sendRequest(${id})">Send barter request</button>`)}function sendRequest(id){let offered=Number(document.getElementById('offer').value);if(!offered)return toast('Publish your first product in Creator studio.');s.requests.push({id:Date.now(),offered,wanted:id,terms:document.getElementById('terms').value,status:'Awaiting recipient'});save();modal.close();go('Barter hub');toast('Request sent. Awaiting the other owner’s decision.')}
function barter(){return `<h1 style="font-size:36px">Great exchanges start here.</h1><p>Find a direct match, negotiate a top-up, or connect a circle of creators.</p><div class="cols"><div class="panel"><div class="eyebrow">FIND YOUR MATCH</div><h2 style="margin-top:12px">What would you trade for?</h2><label>Search an offered product or category</label><input id="bartersearch" placeholder="Try music, photography, or a book" oninput="searchBarter(this.value)"><div id="bartermatches"></div><div class="note">Every listing can specify accepted categories. Requests never transfer products until all owners accept.</div></div><div class="panel"><div class="eyebrow">CIRCULAR MATCHING ENGINE</div><h2 style="margin-top:12px">More people. More possibilities.</h2><p>Checks directed offer-and-want connections to discover closed loops of 3–10 creators.</p><button onclick="findCycles()">Scan barter circles ⇄</button><div id="cycles"></div></div></div><section class="panel"><h2>Barter requests</h2><p class="muted">Use “Simulate recipient” to test both sides in this prototype.</p>${s.requests.length?s.requests.map(r=>{let a=products.find(p=>p.id===r.offered),b=products.find(p=>p.id===r.wanted);return `<div class="panel"><h3>${a.title} ⇄ ${b.title}</h3><p>${r.terms==='full'?'Full swap · no fee':bp(Math.abs(a.price-b.price))+' top-up by lower-priced owner'} · <span class="badge">${r.status}</span></p>${r.status==='Awaiting recipient'?`<button class="small" onclick="recipient(${r.id})">Simulate recipient</button> <button class="small secondary" onclick="statusRequest(${r.id},'Cancelled')">Cancel</button>`:r.status==='Awaiting your agreement'?`<button class="small" onclick="completeRequest(${r.id})">Agree & complete exchange</button>`:''}</div>`}).join(''):'<p>No requests yet. Open a product and select “Offer a barter.”</p>'}</section>`}
function searchBarter(q){document.getElementById('bartermatches').innerHTML=products.filter(p=>`${p.title} ${p.cat} ${p.want}`.toLowerCase().includes(q.toLowerCase())).slice(0,4).map(p=>`<div class="sectionrow"><div><b>${esc(p.title)}</b><div class="muted">Offers ${p.cat} · wants ${p.want}</div></div><button class="small secondary" onclick="requestForm(${p.id})">Offer</button></div>`).join('')}
function recipient(id){let r=s.requests.find(x=>x.id===id);open(`<h2>Recipient’s review</h2><p>Choose the final terms as the other product owner. This is a demo simulation.</p><label>Terms</label><select id="finalterms"><option value="full">Accept full swap · waive difference, no fees</option><option value="topup">Require exact price-difference top-up</option></select><p class="muted">Only the owner of the higher-priced product can require a top-up. The other owner must agree to any changed terms.</p><button onclick="counter(${id})">Approve these terms</button> <button class="secondary" onclick="statusRequest(${id},'Declined');modal.close()">Decline</button>`)}function counter(id){let r=s.requests.find(x=>x.id===id);r.terms=document.getElementById('finalterms').value;r.status='Awaiting your agreement';save();modal.close();render()}function statusRequest(id,status){s.requests.find(x=>x.id===id).status=status;save();render()}function completeRequest(id){let r=s.requests.find(x=>x.id===id),a=products.find(x=>x.id===r.offered),b=products.find(x=>x.id===r.wanted);let diff=b.price-a.price;if(r.terms==='topup'&&diff>0&&s.balance<diff)return toast('Insufficient BP for the top-up.');if(r.terms==='topup'){s.balance-=diff;if(diff<0)s.earned-=diff;}if(!s.owned.includes(b.id))s.owned.push(b.id);r.status='Completed';log('Barter completed: '+b.title,r.terms==='topup'?-diff:0);render();toast('Both owners agreed. Exchange completed.')}
function findCycles(){let found=[];function visit(path){let last=path.at(-1);for(let n of products){if(n.owner===last.owner)continue;if(last.want!==n.cat)continue;if(n.id===path[0].id&&path.length>=3){let ids=path.map(x=>x.id);if(ids[0]===Math.min(...ids))found.push(ids);continue}if(path.length<10&&!path.some(x=>x.id===n.id||x.owner===n.owner))visit([...path,n])}}products.forEach(p=>visit([p]));s.cycles=found;save();document.getElementById('cycles').innerHTML=found.length?found.map((ids,i)=>`<div class="note"><b>${ids.length}-creator circle found</b><div class="cycle">${ids.map(id=>{let p=products.find(x=>x.id===id);return `<span>${p.owner}<br><small>${p.cat} → ${p.want}</small></span>`}).join('')}</div><button class="small secondary" onclick="toast('Demo invitation prepared for ${ids.length} creators. No products transfer until every owner approves.');this.disabled=true;this.textContent='Invitations prepared'">Prepare invitations</button></div>`).join(''):'<p>No closed circles found. Update accepted categories to create a match.</p>'}
function wallet(){return `<h1 style="font-size:36px">Your value, in one place.</h1><p>$1 = 1 Barter Point = 100 unidots. Use exact unidots for prices like $0.99.</p><div class="cols"><section class="panel"><div class="eyebrow">AVAILABLE DEMO BALANCE</div><div class="stat">${bp(s.balance)}</div><div class="muted">${s.balance.toLocaleString()} unidots · purchasing value $${money(s.balance)}</div><label>Add demo funds (USD)</label><input type="number" id="funds" min="1" step=".01" value="25"><p class="muted">International payment providers are not connected. Available methods will depend on country and provider support.</p><button onclick="addFunds()">Add demo points</button></section><section class="panel"><div class="eyebrow">WITHDRAWAL ESTIMATE</div><h2 style="margin-top:15px">80 unidots per 1 BP</h2><p>Each redeemed BP returns $0.80 before mandatory tax. Minimum gross withdrawal: $100 (125 BP).</p><label>Earned balance eligible for demo withdrawal</label><b>${bp(s.earned)}</b><label>BP to redeem</label><input id="redeem" type="number" min="125" step=".01" value="125" oninput="estimate()"><label>Illustrative withholding (%) — actual rate not configured</label><input id="tax" type="number" min="0" max="100" value="0" oninput="estimate()"><div id="estimate" class="note">125 BP → $100 gross. Tax determined before a real payout.</div><button onclick="withdraw()">Test withdrawal eligibility</button></section></div><section class="panel"><h2>Activity</h2><table><thead><tr><th>Transaction</th><th>Time</th><th>BP</th></tr></thead><tbody>${s.log.map(l=>`<tr><td>${esc(l.t)}</td><td>${l.time}</td><td>${l.u>0?'+':''}${bp(l.u)}</td></tr>`).join('')||'<tr><td colspan="3">Your transactions will appear here.</td></tr>'}</tbody></table></section>`}function addFunds(){let v=Number(document.getElementById('funds').value);if(!Number.isFinite(v)||v<=0||v>10000)return toast('Enter an amount between $0.01 and $10,000.');let u=Math.round(v*100);s.balance+=u;log('Demo point purchase',u);render();toast('Demo points added. No money was charged.')}function estimate(){let n=Number(document.getElementById('redeem').value),t=Number(document.getElementById('tax').value);document.getElementById('estimate').textContent=`Gross: $${(n*.8).toFixed(2)} · Illustrative tax: $${(n*.8*t/100).toFixed(2)} · Estimated net: $${(n*.8*(1-t/100)).toFixed(2)}`}function withdraw(){let n=Number(document.getElementById('redeem').value),u=Math.round(n*100),t=Number(document.getElementById('tax').value);if(!Number.isFinite(n)||n<125)return toast('Minimum gross withdrawal is $100: redeem at least 125 BP.');if(t<0||t>100||!Number.isFinite(t))return toast('Enter a tax rate between 0 and 100.');if(u>s.earned||u>s.balance)return toast('Insufficient earned balance. Purchased demo funds are not withdrawable in this prototype.');toast('Eligibility passed. Real payouts require payment, identity, and tax integrations. No payout submitted.')}
function studio(){return `<h1 style="font-size:36px">Make your creativity count.</h1><p>Your storefront, products, and advertising — together.</p><div class="panel sectionrow"><div><span class="eyebrow">CREATOR MEMBERSHIP</span><h2 style="margin-top:10px">$100 / year</h2><p>Upload digital products, accept barter requests, and build your following.</p></div><button onclick="s.sub=true;save();render();toast('Demo creator membership activated. No payment charged.')">${s.sub?'✓ Demo membership active':'Activate demo membership'}</button></div><div class="cols"><section class="panel"><h2>Publish a digital product</h2><label>Product title</label><input id="title" maxlength="80" placeholder="What did you create?"><label>Category</label><select id="cat">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><label>Price (USD = BP)</label><input id="price" type="number" min=".01" step=".01" value="9.99"><label>Sample file</label><input id="sample" type="file"><label>Full product file</label><input id="full" type="file"><p class="muted">Selected files stay local; demo downloads use a placeholder. Secure file hosting is not connected.</p><label class="row"><input type="checkbox" id="available" checked> Available for barter</label><label>Accept barters from</label><select id="want">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><button style="margin-top:18px" onclick="publishProduct()">Publish demo listing</button></section><section class="panel"><h2>Advertising preferences</h2><label class="row"><input type="checkbox" ${s.ads?'checked':''} onchange="s.ads=this.checked;save()"> Allow adverts on my product pages</label><p>Adverts stay on the page, separate from downloaded products. Approve up to five products to rotate in available slots.</p>${products.slice(0,5).map(p=>`<label class="row"><input type="checkbox" ${s.approved.includes(p.id)?'checked':''} onchange="approve(${p.id},this)"> ${p.title}</label>`).join('')}<div class="note">Advert exchange: mutual creator approval, no paid views.<br>Paid promotion: labelled Sponsored; budget ends automatically when spent.</div><label>Promotion option</label><select id="adtype"><option value="paid">Paid promotion</option><option value="exchange">Advert exchange · request mutual approval</option></select><label>Product to promote</label><select id="adproduct">${products.map(p=>`<option value="${p.id}">${p.title}</option>`).join('')}</select><label>Campaign budget (BP)</label><input id="budget" type="number" min=".01" step=".01" value="5"><p class="muted">Demo rate: 0.05 BP per completed 5-second view; 0.02 BP rewards the viewer, 0.03 BP credits the host. One rewarded view per campaign in this browser. Creator sale earnings remain separate from ad views.</p><button onclick="createCampaign()">Create campaign / request</button></section></div><section class="panel"><h2>Campaign dashboard</h2><p>Paid views count only after the demo advert stays open for 5 seconds and the viewer claims the reward. Clicks are tracked separately; no click fee.</p>${s.campaigns.map(c=>`<div class="panel"><span class="badge">${c.type==='exchange'?'Advert exchange · pending mutual approval':c.remaining>=5?'Sponsored · Active':'Budget exhausted · Removed'}</span><h3 style="margin:12px 0">${products.find(p=>p.id===c.product).title}</h3><p>Views: ${c.views} · Clicks: ${c.clicks} · Host earnings allocated: ${bp(c.views*3)} · Attributed purchases: 0 · Spent: ${bp(c.budget-c.remaining)} · Remaining: ${bp(c.remaining)}</p>${c.type==='paid'&&c.remaining>=5?`<button class="small" onclick="watchAd(${c.id})">Preview rewarded advert</button>`:''}</div>`).join('')||'<p class="muted">No campaigns yet.</p>'}</section>`}
function approve(id,el){if(el.checked){if(s.approved.length>=5){el.checked=false;return toast('Approve at most five adverts.')}s.approved.push(id)}else s.approved=s.approved.filter(x=>x!==id);save()}function publishProduct(){if(!s.sub)return toast('Activate the demo creator membership first.');let title=document.getElementById('title').value.trim(),v=Number(document.getElementById('price').value);if(!title||!Number.isFinite(v)||v<=0)return toast('Enter a title and positive price.');let cat=document.getElementById('cat').value,want=document.getElementById('want').value;if(!document.getElementById('available').checked)want='Not available';let p={id:Date.now(),title,cat,want,price:Math.round(v*100),owner:'Singiza Ibrahim',color:'#dfebd6',ink:'#32553b',art:esc(title.slice(0,35))};products.push(p);localStorage.setItem('barterlord-products',JSON.stringify(products.filter(x=>x.owner==='Singiza Ibrahim')));render();toast('Demo listing published. Find it in Explore.')}function createCampaign(){if(!s.sub)return toast('Activate creator membership first.');let type=document.getElementById('adtype').value,budget=Math.round(Number(document.getElementById('budget').value)*100);if(type==='paid'&&(!Number.isFinite(budget)||budget<5||budget>s.balance))return toast('Budget must be at least 0.05 BP and within your balance.');s.campaigns.push({id:Date.now(),type,product:Number(document.getElementById('adproduct').value),budget:type==='paid'?budget:0,remaining:type==='paid'?budget:0,views:0,clicks:0});if(type==='paid'){s.balance-=budget;log('Reserved campaign budget',-budget)}save();render();toast(type==='paid'?'Demo campaign created.':'Advert exchange request prepared for mutual approval.')}
function watchAd(id){let c=s.campaigns.find(x=>x.id===id);if(c.remaining<5)return toast('Campaign budget exhausted.');if(s.seen.includes(id))return toast('You already claimed this campaign’s demo reward.');let p=products.find(x=>x.id===c.product);open(`<span class="eyebrow">SPONSORED · REWARDED ADVERT</span><h2 style="margin:15px 0">${esc(p.title)}</h2><p>${bp(p.price)} · ${p.owner}</p><button class="secondary" onclick="adClick(${id})">View listing details</button><p id="timer">View this advert for 5 seconds to unlock 0.02 BP.</p><button id="claim" disabled onclick="claimAd(${id})">Reward locked</button>`);let start=Date.now();clearInterval(window.adInterval);window.adInterval=setInterval(()=>{if(!modal.open){clearInterval(window.adInterval);return}if(document.visibilityState!=='visible'){start=Date.now();return}let remaining=Math.max(0,5-Math.floor((Date.now()-start)/1000));let el=document.getElementById('timer');if(!el){clearInterval(window.adInterval);return}el.textContent=remaining?`Keep viewing: ${remaining} seconds`:'View complete. Claim your demo reward.';if(!remaining){document.getElementById('claim').disabled=false;document.getElementById('claim').textContent='Claim 0.02 BP';c.ready=true;clearInterval(window.adInterval)}},250)}function adClick(id){let c=s.campaigns.find(x=>x.id===id);c.clicks++;save();toast('Advert click recorded. Product: '+products.find(p=>p.id===c.product).title)}function claimAd(id){let c=s.campaigns.find(x=>x.id===id);if(!c.ready||c.remaining<5||s.seen.includes(id))return;c.ready=false;c.remaining-=5;c.views++;s.seen.push(id);s.hostCredits=(s.hostCredits||0)+3;s.balance+=2;s.earned+=2;log('Rewarded advert view',2);modal.close();render();toast('Earned 2 unidots. 3 unidots allocated to the demo host; advertiser budget reduced by 5.')}try{products.push(...JSON.parse(localStorage.getItem('barterlord-products')||'[]'))}catch{}render();
</script></body></html>
